name: Daily News Digest

on:
  schedule:
    # 台灣時間 05:37 主排程，07:17、09:47 為備援（GitHub 排程常延遲或漏跑）。
    # 同一天重跑只會補新聞、補發沒發成功的貼文，不會重複發文。
    # 避開整點，整點時段 GitHub 最擁擠、最容易延遲。
    - cron: "37 21 * * *"
    - cron: "17 23 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:  # 允許手動按一次測試

permissions:
  contents: write  # 讓機器人把每日結果 commit 回 repo

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # IG 圖卡需要中文字型
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null

      - name: Build today's digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python digest.py

      - name: Commit and push
        run: |
          git config user.name "news-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "沒有變更" && exit 0
          git commit -m "Daily digest $(TZ=Asia/Taipei date +%F)"
          git push

      - name: Post to Telegram / Facebook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          # 等 GitHub Pages 更新完，連結才會是今天的頁面
          if [ -n "$TELEGRAM_BOT_TOKEN$FB_PAGE_TOKEN" ]; then sleep 90; fi
          status=0
          python telegram_post.py || status=1
          python facebook_post.py || status=1
          for f in data/tg_posted.json data/fb_posted.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "Record social posts $(TZ=Asia/Taipei date +%F)"
            git push
          fi
          exit $status
